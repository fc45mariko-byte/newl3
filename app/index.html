<title>LEA·Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: cream sidebar + blush workspace of soft cards, as in the LEA·Study mockup; one-column stack under 900px. */
:root {
  --bg: #fbeef1;
  --surface: #fff9f9;
  --surface-2: #fdf3f5;
  --side: #fbf1dc;
  --ink: #4a2234;
  --muted: #8a6573;
  --line: #f0d8df;
  --accent: #d0607f;
  --accent-ink: #ffffff;
  --accent-soft: #f7d5de;
  --gold: #e3a845;
  --gold-soft: #fbecc9;
  --ok: #3f8f6b;
  --ok-soft: #dcefe5;
  --warn: #b7791f;
  --warn-soft: #fbeccd;
  --bad: #b8435a;
  --bad-soft: #f8d9df;
  --shadow: 0 1px 2px rgba(120, 50, 75, .06), 0 6px 20px rgba(120, 50, 75, .07);
  --font-display: "Playfair Display", "Iowan Old Style", Georgia, serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 16px;
  --r-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1318; --surface: #281b22; --surface-2: #2f2028; --side: #2a2119; --ink: #f6e5ec; --muted: #bea0ad;
    --line: #3e2a34; --accent: #ef8eab; --accent-ink: #2a121c; --accent-soft: #4b2a38; --gold: #e9bd68; --gold-soft: #3f321c;
    --ok: #7fcaa6; --ok-soft: #1f3a2e; --warn: #e7b765; --warn-soft: #3d311b; --bad: #f094a8; --bad-soft: #4a2530;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1318; --surface: #281b22; --surface-2: #2f2028; --side: #2a2119; --ink: #f6e5ec; --muted: #bea0ad;
  --line: #3e2a34; --accent: #ef8eab; --accent-ink: #2a121c; --accent-soft: #4b2a38; --gold: #e9bd68; --gold-soft: #3f321c;
  --ok: #7fcaa6; --ok-soft: #1f3a2e; --warn: #e7b765; --warn-soft: #3d311b; --bad: #f094a8; --bad-soft: #4a2530;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.55 var(--font-body); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100%; background: linear-gradient(to right, var(--side) 220px, transparent 220px); }
.side { background: var(--side); border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }
.brand { font-family: var(--font-display); font-style: italic; font-size: 26px; font-weight: 600; padding: 0 10px; color: var(--ink); text-decoration: none; }
.brand span { color: var(--accent); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; color: var(--ink); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--accent-soft); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav svg { width: 18px; height: 18px; flex: none; }
.side .grow { flex: 1; }
.main { padding-block: 26px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0; }
.main > .wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; padding-inline: clamp(0px, 2vw, 18px); }
.top { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; justify-content: space-between; }
.top h1 { font-size: clamp(30px, 4vw, 42px); font-weight: 700; }
.top .sub { font-family: var(--font-display); font-style: italic; font-size: 18px; color: var(--muted); }
.top .sub b { color: var(--ink); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 500; font-size: 13px; white-space: nowrap; }
.chip svg { width: 15px; height: 15px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.card h2 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
.card h2 svg { width: 20px; height: 20px; color: var(--accent); }
.card h3 { font-size: 16px; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.grid { display: grid; gap: 18px; }
.g-dash-top { grid-template-columns: 1.45fr .8fr .9fr 1fr; }
.g-dash-mid { grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); }
.g-dash-bot { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 1560px) { .g-dash-bot { grid-template-columns: 1.15fr 1fr 1.1fr 1fr; } }
.g-courses { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 1180px) { .g-dash-top { grid-template-columns: 1fr 1fr; } }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; background: none; }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; z-index: 5; flex-direction: row; align-items: center; justify-content: space-between; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-right: 0; border-bottom: 1px solid var(--line); }
  .side .grow { display: none; }
  .side-foot a span { display: none; }
  .nav#nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; flex-direction: row; gap: 0; overflow-x: auto; background: var(--side); border-top: 1px solid var(--line); padding: 4px max(8px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); scrollbar-width: none; }
  .nav#nav a { flex: 1 0 64px; flex-direction: column; gap: 2px; padding: 6px 4px; font-size: 10.5px; border-radius: 10px; }
  .main { padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }
  .brand { font-size: 22px; padding: 0; }
  .g-dash-mid, .g-2 { grid-template-columns: 1fr; }
  .fab { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); width: 52px; height: 52px; padding: 0; font-size: 0; }
  .fab::before { content: "✦"; font-size: 20px; }
  .drawer { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  .chap-list { display: none !important; }
  .chap-select { display: block !important; }
  .chap-nav { position: static; max-height: none; }
  .notion > summary { flex-direction: column; align-items: flex-start; gap: 6px; }
  .top h1 { font-size: 30px; }
}
@media (max-width: 560px) { .g-dash-top, .g-dash-bot { grid-template-columns: 1fr; } .g-courses { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .course-card .name { font-size: 14px; } .form-row { grid-template-columns: 1fr; } .form-row .field { grid-column: auto !important; } .card { padding: 14px; } }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--side); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 999px; cursor: pointer; font-weight: 500; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.soft { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 6px; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn svg { width: 16px; height: 16px; }
.seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 14px; border-radius: 999px; cursor: pointer; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
input[type=text], input[type=date], input[type=time], input[type=number], select, textarea { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 120px; line-height: 1.5; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; align-items: end; }

/* Dashboard pieces */
.goal { display: grid; grid-template-columns: 96px 1fr; gap: 14px; padding: 0; overflow: hidden; }
.goal .art { background: var(--accent-soft); display: grid; place-items: center; }
.goal .body { padding: 16px 16px 16px 0; }
.check { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; cursor: pointer; }
.check input { accent-color: var(--accent); margin-top: 3px; width: 15px; height: 15px; flex: none; }
.check.done span { color: var(--muted); text-decoration: line-through; }
.ring { display: grid; place-items: center; position: relative; }
.ring svg { width: 120px; height: 120px; transform: rotate(-90deg); }
.ring .val { position: absolute; font-family: var(--font-display); font-size: 28px; font-weight: 600; }
.next-class { background: var(--gold-soft); border-color: transparent; }
.next-class .what { font-weight: 600; font-size: 15px; margin-top: 8px; }
.todo-list { display: flex; flex-direction: column; gap: 2px; max-height: 220px; overflow: auto; }
.todo-add { display: flex; gap: 6px; margin-top: 10px; }
.course-card { padding: 0; overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: var(--ink); transition: transform .15s ease, box-shadow .15s ease; }
.course-card:hover { transform: translateY(-2px); }
.course-card .pic { aspect-ratio: 16 / 8; max-width: 100%; display: block; }
.course-card .pic svg { width: 100%; height: 100%; display: block; }
.course-card .info { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.course-card .name { font-family: var(--font-display); font-weight: 600; font-size: 16px; line-height: 1.25; }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; flex: 1; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: auto; }
.list-item { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.list-item > * { min-width: 0; }
.list-item:last-child { border-bottom: 0; }
.icon-tile { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.icon-tile svg { width: 18px; height: 18px; }
.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tool { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px 10px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; color: var(--ink); text-decoration: none; }
.tool:hover { border-color: var(--accent); }
.tool svg { width: 30px; height: 30px; color: var(--accent); }
.tool b { font-family: var(--font-display); font-size: 16px; }
.journey { display: grid; grid-template-columns: minmax(120px, 1fr) minmax(0, 1.4fr); gap: 14px; }
.journey .art { border-radius: 12px; overflow: hidden; min-height: 150px; }
@media (max-width: 480px) { .journey { grid-template-columns: 1fr; } .journey .art { min-height: 120px; aspect-ratio: 2 / 1; } }
.journey .art svg { width: 100%; height: 100%; display: block; }
.badges { display: flex; gap: 8px; margin-top: 10px; }
.badge { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--gold-soft); color: var(--warn); position: relative; }
.badge.locked { background: var(--surface-2); color: var(--muted); opacity: .7; }
.badge svg { width: 20px; height: 20px; }
.quest { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; }
.quest .pts { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.quest .box { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--line); display: grid; place-items: center; flex: none; }
.quest.done .box { background: var(--gold); border-color: var(--gold); color: #fff; }

/* Schedule */
.week { min-width: 460px; display: grid; grid-template-columns: 44px repeat(5, minmax(0, 1fr)); font-size: 12px; overflow-x: auto; }
.week .head { text-align: center; padding: 6px 0; font-weight: 600; color: var(--muted); }
.week .head.today span { background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 2px 8px; }
.week .hours { position: relative; }
.week .hours div { height: 40px; color: var(--muted); font-variant-numeric: tabular-nums; transform: translateY(-7px); }
.week .col { position: relative; border-left: 1px dashed var(--line); min-height: 440px; }
.slot { position: absolute; left: 4px; right: 4px; border-radius: 8px; padding: 4px 6px; font-size: 11.5px; line-height: 1.3; overflow: hidden; border: 1px solid transparent; }
.slot b { display: block; font-weight: 600; }
.slot.k0 { background: var(--accent-soft); color: var(--ink); }
.slot.k1 { background: var(--gold-soft); color: var(--ink); }
.slot.k2 { background: var(--ok-soft); color: var(--ink); }
.slot.deadline { background: var(--bad-soft); border-color: var(--bad); }
.slot button { all: unset; cursor: pointer; float: right; color: var(--muted); }
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; font-size: 12px; }
.month .d { background: var(--surface-2); border-radius: 8px; min-height: 64px; padding: 4px 6px; }
.month .d.out { opacity: .4; }
.month .d.today { outline: 2px solid var(--accent); }
.month .d i { display: block; font-style: normal; background: var(--bad-soft); border-radius: 4px; padding: 0 4px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Course page */
.banner { border-radius: var(--r); overflow: hidden; height: 150px; position: relative; }
.banner svg { width: 100%; height: 100%; display: block; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 10px 14px; cursor: pointer; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.course-layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .course-layout { grid-template-columns: 1fr; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.chap-list { display: flex; flex-direction: column; gap: 2px; }
.chap-nav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
.chap-nav button { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 26px 1fr; gap: 6px; padding: 8px 10px; border-radius: 10px; cursor: pointer; font-size: 13.5px; line-height: 1.35; }
.chap-nav button:hover { background: var(--surface-2); }
.chap-nav button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.chap-nav .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; padding-top: 1px; }
.chap-select { display: none; }
.chap-nav .done-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-left: 6px; vertical-align: middle; }
.label { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
.l-univ { background: var(--ok-soft); color: var(--ok); }
.l-acad { background: var(--accent-soft); color: var(--accent); }
.l-reco { background: var(--gold-soft); color: var(--warn); }
.l-supp { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.p-ESSENTIAL { background: var(--bad-soft); color: var(--bad); }
.p-IMPORTANT { background: var(--warn-soft); color: var(--warn); }
.p-ADVANCED { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.st { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.st.s4::before { background: var(--ok); } .st.s3::before { background: var(--ok); opacity: .6; } .st.s2::before { background: var(--gold); }
.st.s1::before { background: var(--warn); } .st.s0::before { background: var(--bad); }
.labels { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.keys { background: var(--gold-soft); border-radius: 14px; padding: 14px 16px; }
.keys h3 { display: flex; gap: 8px; align-items: center; }
.keys ul { margin: 8px 0 0; padding-left: 18px; }
.keys li { margin: 4px 0; }
.notion { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.notion > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
.notion > summary::-webkit-details-marker { display: none; }
.notion > summary h3 { font-size: 16.5px; }
.notion[open] > summary { border-bottom: 1px solid var(--line); }
.notion .content { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; max-width: 78ch; }
.notion .q { font-family: var(--font-display); font-style: italic; color: var(--muted); font-size: 15px; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
th { background: var(--surface-2); font-weight: 600; }
.formula { font-family: ui-monospace, "SF Mono", Menlo, monospace; background: var(--surface-2); padding: 8px 12px; border-radius: 8px; overflow-x: auto; }
.callout { border-radius: 10px; padding: 10px 12px; background: var(--warn-soft); }
.callout.info { background: var(--surface-2); }
.prose { max-width: 78ch; }
.prose p { margin: .5em 0; }
.prose ul, .prose ol { padding-left: 20px; }
.prose h3 { margin-top: 14px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { justify-content: space-between; }

/* Practice */
.choice { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; background: var(--surface); }
.choice input { accent-color: var(--accent); margin-top: 3px; }
.choice.good { border-color: var(--ok); background: var(--ok-soft); }
.choice.bad { border-color: var(--bad); background: var(--bad-soft); }
.choice .why { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.flash { min-height: 220px; display: flex; flex-direction: column; justify-content: center; gap: 12px; text-align: center; padding: 26px; background: var(--surface-2); border-radius: 18px; border: 1px solid var(--line); }
.flash .q { font-family: var(--font-display); font-size: 20px; }
.flash .a { text-align: left; }
.score { font-family: var(--font-display); font-size: 40px; font-weight: 600; }
.empty { text-align: center; padding: 30px 16px; color: var(--muted); }

/* Assistant */
.chat { display: flex; flex-direction: column; gap: 10px; max-height: 360px; overflow: auto; padding-right: 4px; }
.msg { border-radius: 14px; padding: 10px 12px; max-width: 92%; font-size: 13.5px; }
.msg.me { align-self: flex-end; background: var(--accent-soft); }
.msg.ai { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--line); }
.msg.ai p { margin: .35em 0; }
.chat-input { display: flex; gap: 8px; margin-top: 10px; }
.chat-input input { border-radius: 999px; padding-inline: 14px; }

const DEFAULT_STATE = () => ({

const S = { state: DEFAULT_STATE(), mode: 'browser', ref: null, timer: null, pending: false };
try { const raw = localStorage.getItem(LS_KEY); if (raw) S.state = { ...DEFAULT_STATE(), ...JSON.parse(raw) }; } catch (e) { /* storage unavailable */ }
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S.state)); } catch (e) { /* ignore */ }
  if (!S.ref) return;
  clearTimeout(S.timer);
  S.timer = setTimeout(flush, 900);
}
async function flush() {
  if (!S.ref || S.pending) { if (S.ref) S.timer = setTimeout(flush, 600); return; }
  S.pending = true;
  try { await S.ref.set(JSON.parse(JSON.stringify(S.state))); }
  catch (e) {
    if (e && e.code === 'invalid_argument') { S.ref = null; S.mode = 'browser'; toast('Your progress is saved in this browser only.'); }
    else if (e && e.code === 'quota_exceeded') toast('Storage is full: delete some notes to keep saving.');
  } finally { S.pending = false; }
}
async function connectStore() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc(`data/users/${id}/etat`);
    const timeout = new Promise((r) => setTimeout(() => r('timeout'), 10000));
    const snap = await Promise.race([ref.get(), timeout]);
    if (snap === 'timeout') return;
    if (snap.exists) S.state = { ...DEFAULT_STATE(), ...snap.data() };
    S.ref = ref; S.mode = 'account';
    try { localStorage.setItem(LS_KEY, JSON.stringify(S.state)); } catch (e) { /* ignore */ }
    render();
  } catch (e) { /* stay in browser mode */ }
}

/* ---------- XP, streaks, quests ---------- */
function markActive() { const t = today(); if (!S.state.jours.includes(t)) { S.state.jours = [...S.state.jours, t].slice(-90); } }
function streak() {
  const set = new Set(S.state.jours); let n = 0; let d = new Date();
  if (!set.has(iso(d))) d = addDays(d, -1);
  while (set.has(iso(d))) { n++; d = addDays(d, -1); }
  return n;
}
function gainXP(key, pts, why) {
  if (S.state.xpCles.includes(key)) return false;
  S.state.xpCles = [...S.state.xpCles, key].slice(-600);
  S.state.xp += pts; markActive();
  const s = streak();
  if (s >= 3 && !S.state.xpCles.includes(`streak:${today()}`)) { S.state.xpCles.push(`streak:${today()}`); S.state.xp += 150; toast('+150 XP · 3-day streak'); }
  else toast(`+${pts} XP · ${why}`);
  save(); return true;
}
const level = () => 1 + Math.floor(S.state.xp / 200);
function quests() {
  const t = today();
  const chap = Object.values(S.state.chapitres).some((c) => c.date === t);
  const quiz = Object.values(S.state.quiz).some((q) => q.date === t && q.last >= 80);
  return [
    { t: 'Complete a chapter', pts: 50, done: chap },
    { t: 'Get 80%+ on a quiz', pts: 100, done: quiz },
    { t: 'Study 3 days in a row', pts: 150, done: streak() >= 3 },
  ];
}
function badges() {
  const langs = new Set(Object.keys(S.state.chapitres).map((c) => matiere(c.split('.')[0])?.langue).filter(Boolean));
  return [
    { icon: 'book', t: 'First chapter completed', on: Object.keys(S.state.chapitres).length > 0 },
    { icon: 'globe', t: 'A chapter in French, English and Spanish', on: langs.size >= 3 },
    { icon: 'laurel', t: 'A perfect quiz', on: Object.values(S.state.quiz).some((q) => q.best === 100) },
    { icon: 'plane', t: '7-day streak', on: streak() >= 7 },
  ];
}

/* ---------- Progress ---------- */
function courseProgress(m) {
  const ch = m.chapitres; if (!ch.length) return 0;
  let pts = 0;
  for (const c of ch) { if (S.state.chapitres[c.id]) pts += 1; else if (S.state.quiz[c.id]) pts += Math.min(.8, S.state.quiz[c.id].best / 125); }
  return Math.round((pts / ch.length) * 100);
}
const semesterCourses = () => IDX.matieres.filter((m) => m.semestres.includes(S.state.profil.semestre) && !m.complement);
function overall() { const cs = semesterCourses(); return cs.length ? Math.round(cs.reduce((a, m) => a + courseProgress(m), 0) / cs.length) : 0; }

/* ---------- Schedule helpers ---------- */
function weeklyClasses() {
  return [
    ...IDX.creneaux.map((c) => ({ ...c, fixe: true })),
    ...S.state.evenements.filter((e) => e.type === 'cours'),
  ];
}
function deadlines() {
  return [
    ...IDX.echeances.map((e) => ({ ...e, fixe: true })),
    ...S.state.evenements.filter((e) => e.type === 'echeance' || e.type === 'evenement'),
  ].sort((a, b) => (a.date + (a.debut || '')).localeCompare(b.date + (b.debut || '')));
}
function nextClass() {
  const now = new Date(); let best = null;
  for (const c of weeklyClasses()) {
    for (let k = 0; k < 8; k++) {
      const d = addDays(now, k);
      if (d.getDay() !== c.jour) continue;
      const [h, mi] = c.debut.split(':').map(Number);
      const start = new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, mi);
      if (start > now) { if (!best || start < best.start) best = { c, start }; break; }
    }
  }
  return best;
}

function weekGrid(offset, compact) {
  const mon = addDays(mondayOf(new Date()), offset * 7); const H0 = 8, H1 = compact ? 17 : 19, PX = 40;
  const days = [0, 1, 2, 3, 4].map((i) => addDays(mon, i));
  const classes = weeklyClasses(); const dl = deadlines();
  let html = `<div class="week"><div></div>${days.map((d) => `<div class="head ${iso(d) === today() ? 'today' : ''}"><span>${DAYS[d.getDay()]} ${d.getDate()}</span></div>`).join('')}`;
  html += `<div class="hours">${Array.from({ length: H1 - H0 }, (_, i) => `<div>${pad(H0 + i)}:00</div>`).join('')}</div>`;
  for (const d of days) {
    const items = [
      ...classes.filter((c) => c.jour === d.getDay()).map((c) => ({ ...c, kind: 'class' })),
      ...dl.filter((e) => e.date === iso(d)).map((e) => ({ ...e, debut: e.debut || '08:00', fin: e.fin || '09:00', kind: 'deadline' })),
    ];
    html += `<div class="col" style="min-height:${(H1 - H0) * PX}px">${items.map((it, k) => {
      const [a, b] = it.debut.split(':').map(Number); const [c2, d2] = it.fin.split(':').map(Number);
      const top = ((a + b / 60) - H0) * PX; const h = Math.max(30, ((c2 + d2 / 60) - (a + b / 60)) * PX);
      if (top < 0 || top > (H1 - H0) * PX) return '';
      const title = it.matiere ? short(subjectName(it.matiere)) : it.titre;
      const del = !it.fixe ? `<button data-del-ev="${it.id}" aria-label="Delete">×</button>` : '';
      return `<div class="slot ${it.kind === 'deadline' ? 'deadline' : 'k' + (k % 3)}" style="top:${top}px;height:${h}px" title="${esc(it.titre || title)}">${del}<b>${esc(title)}</b>${esc(it.debut)}–${esc(it.fin)}${it.lieu ? ` · ${esc(it.lieu)}` : ''}${it.kind === 'deadline' ? `<br>${esc(it.titre)}` : ''}</div>`;
    }).join('')}</div>`;
  }
  return html + '</div>';
}
function bindDeleteEvents(root) {
  root.querySelectorAll('[data-del-ev]').forEach((b) => b.addEventListener('click', () => {
    S.state.evenements = S.state.evenements.filter((e) => e.id !== b.dataset.delEv); save(); render();
  }));
}

function renderBlocs(blocs) {
  return (blocs || []).map((b) => {
    const t = b.titre ? `<b>${esc(b.titre)}</b>` : '';
    switch (b.type) {
      case 'texte': return `<p>${esc(b.texte)}</p>`;
      case 'etapes': return `${t}<ol>${b.etapes.map((x) => `<li>${esc(x)}</li>`).join('')}</ol>`;
      case 'liste': return `${t}<ul>${b.items.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`;
      case 'tableau': return `${t}<div class="tbl"><table><thead><tr>${b.entetes.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.lignes.map((r) => `<tr>${r.map((x) => `<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      case 'formule': return `${t}<div class="formula">${esc(b.formule)}</div>${b.legende ? `<div class="small muted">${esc(b.legende)}</div>` : ''}`;
      case 'calcul': return `${t}<div class="tbl"><table><tbody>${b.lignes.map((l) => `<tr><td>${esc(l.libelle)}</td><td style="text-align:right;font-variant-numeric:tabular-nums">${esc(l.valeur)}</td></tr>`).join('')}</tbody></table></div>`;
      case 'attention': return `<div class="callout">${esc(b.texte)}</div>`;
      default: return '';

  }).join('');
}

/* ---------- Practice: quiz, flashcards, exercises ---------- */
function startQuiz(questions, key) { UI.practice = { kind: 'quiz', key, qs: shuffle(questions).slice(0, 10), i: 0, good: 0, answered: false }; }
function startFlash(cards, key) {
  const t = today();
  const due = cards.filter((f) => !S.state.cartes[f.id] || S.state.cartes[f.id].next <= t);
  UI.practice = { kind: 'flash', key, cards: shuffle(due.length ? due : cards), i: 0, shown: false };
}
function practiceView(el, onExit) {
  const P = UI.practice;
  if (P.kind === 'quiz') {
    if (P.i >= P.qs.length) {
      const pct = Math.round((P.good / P.qs.length) * 100);
      const prev = S.state.quiz[P.key] || { best: 0, n: 0 };
      S.state.quiz[P.key] = { best: Math.max(prev.best, pct), last: pct, n: prev.n + 1, date: today() };
      markActive();
      if (pct >= 80) gainXP(`quiz:${P.key}:${today()}`, 100, 'Quiz 80%+'); else save();
      el.innerHTML = `<div class="card stack" style="text-align:center"><div class="score">${pct}%</div><p>${P.good} correct out of ${P.qs.length}. Best score on this chapter: ${S.state.quiz[P.key].best}%.</p><div class="row" style="justify-content:center"><button class="btn primary" id="again">Try again</button><button class="btn" id="exit">Done</button></div></div>`;
      $('#again').onclick = () => { startQuiz(P.qs, P.key); practiceView(el, onExit); }; $('#exit').onclick = onExit; return;
    }
    const q = P.qs[P.i]; const multi = q.format === 'multiple';
    el.innerHTML = `<div class="card stack"><div class="row spread"><span class="muted small">Question ${P.i + 1} / ${P.qs.length}</span><button class="btn ghost" id="exit">Stop</button></div>
      ${q.support?.texte ? `<div class="callout info">${esc(q.support.texte)}</div>` : ''}${q.support?.entetes ? renderBlocs([{ type: 'tableau', entetes: q.support.entetes, lignes: q.support.lignes }]) : ''}
      <h3>${esc(q.enonce)}</h3>${multi ? '<span class="muted small">Several answers possible.</span>' : ''}
      <div class="stack" id="choices">${q.choix.map((c) => `<label class="choice" data-c="${c.id}"><input type="${multi ? 'checkbox' : 'radio'}" name="q" value="${c.id}"><div><div>${esc(c.texte)}</div><div class="why" hidden>${esc(c.explication)}</div></div></label>`).join('')}</div>
      <div class="row"><button class="btn primary" id="check">Check</button></div></div>`;
    $('#exit').onclick = onExit;
    $('#check').onclick = () => {
      if (P.answered) { P.i++; P.answered = false; return practiceView(el, onExit); }
      const picked = [...el.querySelectorAll('input:checked')].map((x) => x.value); if (!picked.length) return;
      const correct = q.choix.filter((c) => c.correct).map((c) => c.id);
      const ok = picked.length === correct.length && picked.every((x) => correct.includes(x));
      if (ok) P.good++;
      el.querySelectorAll('[data-c]').forEach((l) => { const c = q.choix.find((x) => x.id === l.dataset.c); if (c.correct) l.classList.add('good'); else if (picked.includes(c.id)) l.classList.add('bad'); l.querySelector('.why').hidden = false; l.querySelector('input').disabled = true; });
      P.answered = true; $('#check').textContent = P.i + 1 < P.qs.length ? 'Next question' : 'See my score';
    };
    return;
  }
  if (P.kind === 'flash') {
    if (P.i >= P.cards.length) { el.innerHTML = `<div class="card empty"><p>Session finished: ${P.cards.length} cards reviewed.</p><button class="btn primary" id="exit">Done</button></div>`; $('#exit').onclick = onExit; return; }
    const f = P.cards[P.i];
    el.innerHTML = `<div class="card stack"><div class="row spread"><span class="muted small">Card ${P.i + 1} / ${P.cards.length}</span><button class="btn ghost" id="exit">Stop</button></div>
      <div class="flash"><div class="q">${esc(f.question)}</div>${P.shown ? `<div class="a prose"><p>${esc(f.reponse)}</p>${f.indispensables?.length ? `<b>Must include</b><ul>${f.indispensables.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}${f.erreurs?.length ? `<b>Common mistakes</b><ul>${f.erreurs.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</div>` : ''}</div>
      <div class="row" style="justify-content:center">${P.shown ? '<button class="btn" id="again">Review again</button><button class="btn primary" id="knew">I knew it</button>' : '<button class="btn primary" id="show">Show answer</button>'}</div></div>`;
    $('#exit').onclick = onExit;
    if (!P.shown) { $('#show').onclick = () => { P.shown = true; practiceView(el, onExit); }; return; }
    const grade = (knew) => {
      const cur = S.state.cartes[f.id] || { box: 0 }; const box = knew ? Math.min(cur.box + 1, 5) : 0;
      S.state.cartes[f.id] = { box, next: iso(addDays(new Date(), [1, 2, 4, 8, 16, 32][box])) };
      gainXP(`flash:${f.id}:${today()}`, 5, 'Flashcard reviewed'); save(); P.i++; P.shown = false; practiceView(el, onExit);
    };
    $('#knew').onclick = () => grade(true); $('#again').onclick = () => grade(false);
  }
}

/* ---------- AI Study Assistant ---------- */
const CHAT = { msgs: [], busy: false, ctrl: null, sample: undefined };
async function getSample() {
  if (CHAT.sample !== undefined) return CHAT.sample;
  try { CHAT.sample = window.claude && window.claude.use ? await window.claude.use('sample') : null; } catch (e) { CHAT.sample = null; }
  return CHAT.sample;
}
async function contextText() {
  const ctx = window.__ctx || {}; const m = ctx.matiere ? matiere(ctx.matiere) : null;
  if (!m) return `Courses this semester: ${semesterCourses().map((x) => x.titre).join('; ')}.`;
  let t = `Current course: ${m.titre} (language of instruction: ${m.langue}). Chapters: ${m.chapitres.map((c) => c.titre).join('; ')}.`;
  if (m.officiel?.description) t += `\nOfficial description: ${m.officiel.description}`;
  const c = m.chapitres.find((x) => x.id === ctx.chapitre);
  if (c) {
    t += `\nCurrent chapter: ${c.titre} (research status: ${c.statut}; provenance: ${c.provenance.join(', ')}).`;
    try {
      const d = await loadM(m.id); const ch = d.chapitres[c.id];
      if (ch) t += '\nChapter notes:\n' + ch.notions.map((n) => `- ${n.titre}: ${n.definition || ''} ${n.explication || ''}`).join('\n').slice(0, 7000);
      const reco = d.notesReconstruites?.[c.id]; if (reco) t += '\nReconstructed notes:\n' + reco.corps.slice(0, 5000);
    } catch (e) { /* no notes */ }
  }
  return t;
}
const SYSTEM = `You are the study assistant of LEA·Study, for a third-year LEA (English-Spanish, international business) student at the Université d'Orléans. Answer in the language the student writes in. Be clear and concrete, at French L3 level, with short paragraphs or lists. When the course notes below cover the question, base your answer on them. When you add knowledge that is not in the notes, say so in one short line ("Not in your notes:"). Never invent references, figures, dates or teacher instructions; if unsure, say what should be checked. Do not present reconstructed material as the teacher's course.`;
function mountAssistant(el, compact) {
  if (!el) return;
  const msgs = CHAT.msgs.slice(compact ? -4 : -20);
  el.innerHTML = `<div class="card-head"><h2>${ICON.spark} AI Study Assistant</h2>${compact ? '' : '<button class="btn ghost" id="chat-close" aria-label="Close">×</button>'}</div>
    <div class="chat" id="chat-log">${msgs.length ? msgs.map((x) => `<div class="msg ${x.role === 'user' ? 'me' : 'ai'}">${x.role === 'user' ? esc(x.content) : md(x.content)}</div>`).join('') : `<div class="msg ai"><p>Ask me to explain a notion, give an example, summarise a chapter or quiz you. ${window.__ctx?.matiere ? `I can see your current course: <b>${esc(subjectName(window.__ctx.matiere))}</b>.` : 'Open a course to give me its notes.'}</p></div>`}</div>
    <div class="row" style="margin-top:8px">${[['Simplify', 'Explain that again more simply.'], ['Give an example', 'Give me a concrete example related to international business.'], ['Make a summary', 'Make a summary of the current chapter in 6 bullet points.'], ['Quiz me', 'Ask me 3 exam-style questions on the current chapter, one at a time, and wait for my answer.']].map(([t, p]) => `<button class="btn soft small" data-quick="${esc(p)}">${t}</button>`).join('')}</div>
    <form class="chat-input" id="chat-form"><input type="text" id="chat-text" placeholder="Ask anything about your courses…" aria-label="Your question"><button class="btn primary" type="submit" aria-label="Send">${ICON.send}</button></form>
    <p class="small muted" id="chat-note" hidden></p>`;
  const log = $('#chat-log', el); log.scrollTop = log.scrollHeight;
  const send = async (text) => {
    if (!text || CHAT.busy) return;
    const s = await getSample();
    if (!s) { const n = $('#chat-note', el); n.hidden = false; n.textContent = 'The assistant works when this page is opened on claude.ai. Here you can still study with the course notes, quizzes and flashcards.'; return; }
    CHAT.msgs.push({ role: 'user', content: text }); CHAT.msgs.push({ role: 'assistant', content: 'Thinking…' }); CHAT.busy = true; mountAssistant(el, compact);
    const ctx = await contextText();
    const history = CHAT.msgs.slice(0, -1).slice(-12).map((m2) => ({ role: m2.role, content: m2.content }));
    history[0] = { role: 'user', content: `${SYSTEM}\n\nContext:\n${ctx}\n\nStudent: ${history[0].content}` };
    if (history[0].role !== 'user') history.shift();
    const live = CHAT.msgs[CHAT.msgs.length - 1];
    try {
      const r = await s(history, { cache: false, onText: ({ text: t2 }) => { live.content = t2; const last = $('#chat-log', el)?.lastElementChild; if (last) { last.innerHTML = md(t2); $('#chat-log', el).scrollTop = 1e9; } } });
      live.content = r.text || live.content; markActive(); save();
    } catch (e) {
      live.content = e && e.code === 'not_granted' ? 'The assistant needs your permission to use Claude. Allow it from the page permissions to use it.' : e && e.code === 'rate_limited' ? 'Too many questions in a short time. Wait a minute, then ask again.' : (e && e.text) || 'The assistant could not answer. Try again in a moment.';
    } finally { CHAT.busy = false; mountAssistant(el, compact); }
  };
  $('#chat-form', el).addEventListener('submit', (e) => { e.preventDefault(); const i = $('#chat-text', el); const t = i.value.trim(); i.value = ''; send(t); });
  el.querySelectorAll('[data-quick]').forEach((b) => b.addEventListener('click', () => send(b.dataset.quick)));
  const close = $('#chat-close', el); if (close) close.onclick = () => { $('#drawer').classList.remove('open'); $('#fab').hidden = false; };
}
$('#fab').addEventListener('click', () => { const d = $('#drawer'); d.innerHTML = '<div class="card" id="drawer-card"></div>'; d.classList.add('open'); $('#fab').hidden = true; mountAssistant($('#drawer-card'), false); });
